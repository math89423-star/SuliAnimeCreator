services:
  # service 名不叫 backend：compose 会把 service 名注册成该服务所在**每个**网络的别名，
  # 叫 backend 就会在共享网络 infra 上跟 L-Port 的 lport_backend 抢同一个名字
  # （DNS 随机返回两个 IP → 解析到对方再连 :5001 必被拒，「有时通有时不通」）。
  # 改名后 infra 上只有 suli-anime-backend；私有网络上额外挂 backend 别名给自家 frontend。
  suli-anime-backend:
    build: ./backend
    container_name: sulianimecreator-backend-1
    ports:
      - "5001:5001"
    volumes:
      - ./backend/data:/app/data
      # 后端源码热挂：镜像里的 app/ 是构建期副本，改了代码不重建镜像就永远是旧逻辑
      # （2026-10-16 事故：cast 角色库化改完，路由 404，查出来跑的是旧镜像）。
      - ./backend/app:/app/app
      - ./skills:/skills:ro
      - /home/administrator/L-Port-Comfy/app/backend/data/libraries/投流素材库:/lport-lib
      - /home/administrator/L-Port-Comfy/app/backend/data/libraries/广告引流素材库:/lport-ads
      # dsh 原生 runtime 家目录（项目本地 ./dsh-home:/root/.dsh）：
      # 首次部署先 mkdir dsh-home，把宿主 ~/.dsh/{profiles,.credentials.yaml} 拷进去；
      # sessions/凭据全落这里，不进镜像。详见 README 部署节。
      - ./dsh-home:/root/.dsh
      # dsh CLI 各版本（宿主 dsh-runtime/<版本>/，由 scripts/dsh-runtime.sh 安装 + 打破甲补丁）：
      # 挂进来后容器按 DSH_VERSION 选版本跑，dsh 升版不必重建镜像。
      # 每版本目录自带完整的 @deepseek-ai/* bundle（profile 的 dsh-base/dsh-headless 从这里解析），
      # 所以不同版本互不干扰。
      - ./dsh-runtime:/opt/dsh
      # 破甲内核（提示词层/策略层）源码：profile 里 dsh-corebreak 是指向
      # /home/administrator/LLMCoreBreak/dsh 的**绝对**软链，容器内挂同一路径即可解析
      # （路径与宿主一致 = 宿主/容器两边都能用同一份 profile 软链，不挂进来会报
      # 「skipping profile bundle "dsh-corebreak"」）。
      - /home/administrator/LLMCoreBreak/dsh:/home/administrator/LLMCoreBreak/dsh:ro
      # 项目指令链：容器 WORKDIR=/app，AGENTS.md 走"cwd 向上收集"，两处都要挂。
      - ./backend/AGENTS.md:/app/AGENTS.md:ro
      - ./AGENTS.md:/AGENTS.md:ro
      # dsh 桥接层（拒答治理口径：授权话术不再贴进 user 消息，改走系统级注入）。
      # 镜像里是构建期副本；改这一个文件不必整镜像 rebuild，挂进去即可热生效（重启容器）。
      - ./backend/app/api/dsh.py:/app/app/api/dsh.py:ro
    extra_hosts:
      # 宿主自带 SearXNG（:8888）时，容器内用 http://host.docker.internal:8888 够到它；
      # 不填 SEARXNG_URL 则走容器内 127.0.0.1:8888（连不上自动降级 Wikipedia/DDG，不报错）
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=sqlite:///suli.db
      - FLASK_DEBUG=0
      # dsh CLI 版本：装在宿主 dsh-runtime/<版本>/，容器挂载后按此选版本。
      # 升版 = scripts/dsh-runtime.sh install <版本> + 改 .env 的 DSH_VERSION + 重启容器，
      # 不重建镜像（dsh 已移出镜像，见 backend/Dockerfile）。
      - DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}
      - DSH_BIN=/opt/dsh/${DSH_VERSION:-0.2.0-rc.2}/bin/dsh
      - DSH_HOME=/root/.dsh
      - DSH_TIMEOUT_S=180
      # dsh 是 Node 进程，默认只认 Node 内置根（编在二进制里，apt/pip 都管不到）。
      # 让它改用 OpenSSL 系统库：ca-certificates 一升级就同步生效，不再三处漂移。
      - NODE_OPTIONS=--use-openssl-ca
      - SEARXNG_URL=http://searxng:8080
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_BASE=${OPENCODE_BASE:-https://opencode.ai/zen/go/v1}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/deepseek-v4.1-flash}
      # H站（hanime1.me）下载走宿主代理（容器直连该站被墙：DNS 污染/403）。
      # 代理地址按自己环境换；留空则直连（能直连的环境不用配）。
      - HANIME_PROXY=${HANIME_PROXY:-http://172.31.160.1:7897}
    env_file:
      - path: ./.env
        required: false
    networks:
      default:
        # 私有网络：backend 这个名字只归我们（frontend 的 nginx proxy_pass http://backend:5001 走这里）。
        aliases: [backend]
      infra:
        # 共享网络 infra 上**不叫 backend** —— 那个名字已归 L-Port 的 lport_backend
        # （同一个 infra 上两个容器都注册 backend 时，DNS 会随机返回两个 IP：
        #  解析到 L-Port 那台再连 :5001 必然被拒，表现为「有时通有时不通」）。
        # 这里用项目唯一别名，谁要调我们走 suli-anime-backend:5001。
        aliases: [suli-anime-backend]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - suli-anime-backend
    restart: unless-stopped
networks:
  infra:
    external: true
