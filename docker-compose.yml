services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend/data:/app/data
      # dsh 原生 runtime 家目录（项目本地 ./dsh-home:/root/.dsh）：
      # 首次部署先 mkdir dsh-home，把宿主 ~/.dsh/{profiles,.credentials.yaml} 拷进去；
      # sessions/凭据全落这里，不进镜像。详见 README 部署节。
      - ./dsh-home:/root/.dsh
    environment:
      - DATABASE_URL=sqlite:///suli.db
      - FLASK_DEBUG=0
      - DSH_BIN=dsh
      - DSH_HOME=/root/.dsh
      - DSH_TIMEOUT_S=180
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_BASE=${OPENCODE_BASE:-https://opencode.ai/zen/go/v1}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/muse-spark-1.3-contributor}
    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
