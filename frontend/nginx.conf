server {
  listen 80;
  # 参考图/素材图上传体积上限（默认 1M 会把导演页 >1M 的图全部 413 挡下）
  client_max_body_size 100m;
  client_body_timeout 300s;
  # 构建产物全是哈希文件名：页面壳（index.html 及 SPA 回退）必须每次取新，
  # 否则标签页开久了再点导航，会去找已被新构建删掉的旧 chunk → 404 → 看着像“点不动”
  # （2026-10-16 事故：/board 点“美术工具”没反应，干净浏览器复测正常）。
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }
  location /api/ {
    proxy_pass http://backend:5001;
    proxy_set_header Host $host;
    # dsh 只在「每步结束」推事件：写 3 分钟剧本这类长文，单步静默常超 200s。
    # 旧值 200s 会在静默期掐断 SSE → 后端按设计杀掉 dsh 子进程 → 本轮成果全丢（2026-10-16 事故）。
    # 读超时按「单步静默上限」给足，前端另有「停止」按钮和事件计数兜底。
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    # SSE 必须即到即转：一攒就变成"运行中没反应"，也会误触上面的读超时
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }
}
